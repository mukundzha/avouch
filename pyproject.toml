[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrut"
version = "0.3.0"
description = "Git-aware Python static code review CLI powered by AST analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Mukund" }
]

keywords = [
    "python",
    "cli",
    "git",
    "ast",
    "static-analysis",
    "code-review",
    "developer-tools",
    "code-quality",
    "linting"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]

dependencies = [
    "rich>=14.0.0"
]

[project.urls]
Homepage = "https://github.com/mukundzha/scrut"
Repository = "https://github.com/mukundzha/scrut"
Issues = "https://github.com/mukundzha/scrut/issues"

[project.scripts]
scrut = "scrut.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]